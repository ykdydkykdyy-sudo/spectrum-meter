
name: Build Spectrum Meter for Mac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Get JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Configure
        run: cmake -S . -B build -DJUCE_DIR="$GITHUB_WORKSPACE/JUCE" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-Meter-Mac
          path: build/
